name: CI Switch/libnx

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Upstream pins a frozen toolchain image. Anything built with it warns
      # "This application does not support the current ABI" on a modern
      # Atmosphere, which is what #18412 describes. Build against a current
      # devkitPro instead and see whether the warning and the Core Downloader
      # crash both go away.
      image: devkitpro/devkita64:latest
      options: --user root

    steps:
    - uses: actions/checkout@v3

    - name: Install the port libraries the pinned image had preinstalled
      run: |
        for attempt in 1 2 3; do
          dkp-pacman --noconfirm -Sy switch-dev switch-portlibs && break
          echo "attempt $attempt failed"; sleep $((attempt * 20))
        done

    - name: Compile RA
      run: |
        make -f Makefile.libnx -j$(getconf _NPROCESSORS_ONLN) clean
        make -f Makefile.libnx -j$(getconf _NPROCESSORS_ONLN) HAVE_STATIC_DUMMY=1
    - name: Get short SHA
      id: slug
      run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

    - uses: actions/upload-artifact@v4
      with:
        name: RA-libnx-dummy-${{ steps.slug.outputs.sha8 }}
        path: |
          retroarch_switch.nro

    # Without this a crash report gives an address and no way to resolve it.
    # The build id in the report is what matches a crash to this exact elf.
    - uses: actions/upload-artifact@v4
      with:
        name: RA-libnx-elf-${{ steps.slug.outputs.sha8 }}
        path: |
          retroarch_switch.elf
