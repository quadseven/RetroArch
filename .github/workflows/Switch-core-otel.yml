name: CI Switch core with OTLP

# The Switch build produces two very different binaries from this same tree.
#
#   HAVE_STATIC_DUMMY=1  ->  retroarch_switch.nro, the salamander launcher
#   (no flag)            ->  <core>_libretro_libnx.nro, RetroArch statically
#                            linked against libretro_libnx.a
#
# Picking a game makes the launcher exec the second binary and exit, so a
# launcher-only build reports its own startup and then goes quiet for the
# entire time a game is actually running. Instrumenting gameplay means
# building the core NRO from this fork rather than taking the prebuilt one
# from the libretro buildbot, which has no exporter in it.
#
# The buildbot publishes only finished .nro files and no .a, so each core is
# compiled from source here and handed to the RetroArch link step.
#
# Each core's repo and branch below is taken from libretro-super's own
# recipes/nintendo/libnx, which is what the buildbot actually builds. Two of
# them are not the obvious choice and were the reason this workflow failed for
# a month:
#
#   mupen64plus_next  builds from develop, not the default branch
#   ppsspp            builds from m4xw/ppsspp branch switch, NOT hrydgard's
#                     upstream, whose libretro Makefile has no libnx platform
#                     at all and answers "Nothing to be done for 'all'"
#
# When a core is broken against the current toolchain, the fix goes in
# .github/patches/ and is applied after cloning. Any patch that stops applying
# fails the build rather than being skipped.
#
# This runs on push rather than workflow_dispatch because GitHub only
# registers dispatchable workflows from the default branch, and this work
# lives on a feature branch.

on:
  push:
    paths:
      - ".github/workflows/Switch-core-otel.yml"
      - ".github/patches/**"
      - "otlp_log_exporter.c"
      - "otlp_log_exporter.h"
      - "Makefile.libnx"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root

    strategy:
      # One core failing to compile says nothing about the others, and PPSSPP
      # is much the largest of the three, so let each stand or fall alone.
      fail-fast: false
      matrix:
        include:
          - core: mgba
            repo: https://github.com/libretro/mgba
            branch: master
            makedir: "."
            makefile: Makefile.libretro
            submodules: "false"
            extraflags: ""
            patch: ""
          - core: mupen64plus_next
            repo: https://github.com/libretro/mupen64plus-libretro-nx
            branch: develop
            makedir: "."
            makefile: Makefile
            submodules: "false"
            extraflags: ""
            patch: mupen64plus-libnx4-virtmem.patch
          # m4xw's fork, not hrydgard/ppsspp: this is the one carrying the
          # libnx platform block, and it is what the buildbot recipe names.
          - core: ppsspp
            repo: https://github.com/m4xw/ppsspp
            branch: switch
            makedir: libretro
            makefile: Makefile
            submodules: "true"
            extraflags: ""
            patch: ""

    steps:
      - name: Checkout RetroArch (this fork, with the exporter)
        uses: actions/checkout@v4
        with:
          path: retroarch

      - name: Install port libraries
        # pkg.devkitpro.org intermittently answers 403 on the database sync,
        # which fails a build that has nothing wrong with it.
        run: |
          for attempt in 1 2 3 4 5; do
            dkp-pacman --noconfirm -Sy switch-dev switch-portlibs && exit 0
            echo "attempt ${attempt} failed"; sleep $(( attempt * 20 ))
          done
          echo "package install failed"; exit 1

      - name: Clone the core
        env:
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          SUBMODULES: ${{ matrix.submodules }}
        # The branch is always named explicitly. Cloning the default branch
        # silently builds something other than what the buildbot builds, which
        # is how the N64 core ended up compiled from a branch nobody ships.
        run: |
          if [ "$SUBMODULES" = "true" ]; then
            git clone --depth 1 --branch "$BRANCH" --recursive "$REPO" core
          else
            git clone --depth 1 --branch "$BRANCH" "$REPO" core
          fi
          echo "core checked out at $BRANCH $(git -C core rev-parse --short HEAD)"

      - name: Patch the core for the current toolchain
        env:
          PATCH: ${{ matrix.patch }}
        # A patch that no longer applies means upstream moved and the fix needs
        # rewriting. Failing here is the point: silently building unpatched
        # would either fail later with an unrelated-looking error or, worse,
        # succeed and ship a core with a known defect in it.
        run: |
          if [ -z "$PATCH" ]; then
            echo "no patch for this core"
            exit 0
          fi
          P="$GITHUB_WORKSPACE/retroarch/.github/patches/$PATCH"
          if [ ! -f "$P" ]; then
            echo "patch $PATCH is named in the matrix but not present at $P"
            exit 1
          fi
          git -C core apply --verbose "$P"
          echo "applied $PATCH"

      - name: Build the core as a static library
        working-directory: core
        env:
          MAKEFILE: ${{ matrix.makefile }}
          MAKEDIR: ${{ matrix.makedir }}
          EXTRAFLAGS: ${{ matrix.extraflags }}
        # PPSSPP's libretro Makefile includes Makefile.common relative to its
        # own directory, so it has to be run from there rather than via
        # -f libretro/Makefile from the repository root.
        run: |
          # shellcheck disable=SC2086
          make -C "$MAKEDIR" -f "$MAKEFILE" platform=libnx $EXTRAFLAGS \
            -j"$(getconf _NPROCESSORS_ONLN)"
          echo "--- static libraries produced ---"
          find . -name "*.a" -size +100k | head

      - name: Hand the core to the RetroArch link step
        # Selected by ABI rather than by filename. Several of these repos
        # vendor unrelated prebuilt archives (PPSSPP ships MoltenVK and ffmpeg
        # for iOS), and a name or size heuristic happily picks one of those.
        # The link then fails on every retro_* entry point, far from the cause.
        # An archive that defines retro_api_version is a libretro core; nothing
        # else is.
        run: |
          NM="$DEVKITPRO/devkitA64/bin/aarch64-none-elf-nm"
          [ -x "$NM" ] || NM="nm"
          echo "--- every archive built ---"
          find core -name "*.a" -size +20k | sed "s/^/    /"
          CORE_LIB=""
          while IFS= read -r a; do
            if "$NM" --defined-only "$a" 2>/dev/null | grep -qE " T retro_api_version"; then
              CORE_LIB="$a"; break
            fi
          done <<EOF
          $(find core -name "*.a" -size +20k)
          EOF
          if [ -z "$CORE_LIB" ]; then
            echo "no archive exports retro_api_version, so no libretro core was built"
            exit 1
          fi
          echo "selected $CORE_LIB"
          cp "$CORE_LIB" retroarch/libretro_libnx.a

      - name: Build the instrumented core NRO
        working-directory: retroarch
        # No HAVE_STATIC_DUMMY here: that is what makes the build link
        # libretro_libnx.a and produce a core rather than the launcher.
        #
        # TARGET is deliberately left at its default. Makefile.common gates
        # every Switch driver behind "ifeq ($(TARGET), retroarch_switch)", so
        # overriding it to name the core silently drops platform_switch.o,
        # switch_ctx.o, switch_joypad.o and the audio drivers, and the link
        # then fails on undefined references to all of them. Build under the
        # expected name and rename afterwards.
        env:
          CORE: ${{ matrix.core }}
        run: |
          make -f Makefile.libnx -j"$(getconf _NPROCESSORS_ONLN)"
          mv retroarch_switch.nro "${CORE}_libretro_libnx.nro"
          mv retroarch_switch.elf "${CORE}_libretro_libnx.elf"
          ls -la ./*.nro ./*.elf

      - name: Confirm the exporter is actually in the binary
        working-directory: retroarch
        # A core NRO that silently lacks the exporter looks identical to one
        # that has it until it ships nothing, which is the failure this whole
        # workflow exists to prevent.
        env:
          CORE: ${{ matrix.core }}
        run: |
          NRO="${CORE}_libretro_libnx.nro"
          for s in "otel-status.txt" "otel-endpoint" "started, endpoint=%s"; do
            if strings -a "$NRO" | grep -qF "$s"; then
              echo "ok      $s"
            else
              echo "MISSING $s"; exit 1
            fi
          done
          python3 - "$NRO" <<'PY'
          import sys
          blob = open(sys.argv[1], 'rb').read()
          needle = b"Content-Type: application/json"
          i = blob.find(needle)
          if i < 0:
              sys.exit("header string absent")
          tail = blob[i + len(needle):i + len(needle) + 2]
          if tail != b"\r\n":
              sys.exit("header not CRLF terminated: %r" % tail)
          print("ok      request headers are CRLF terminated")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.core }}-otel-nro
          path: retroarch/${{ matrix.core }}_libretro_libnx.nro

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.core }}-otel-elf
          path: retroarch/${{ matrix.core }}_libretro_libnx.elf
